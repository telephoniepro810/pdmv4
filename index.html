PE_LIST.forEach(({ key: pe }) => {
  POPULATION_STATUTS.filter(({site}) => DR.includes(site)).forEach(({key}) => {
    INIT_FLUX[pe][key] = Array(12).fill(0);
  });
});
// Une répartition horaire automatique est calculée à partir de la charge reçue.
const positive = (v) => Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0;

const INIT_REPARTITION_HEURES = Object.fromEntries(POPULATION_STATUTS.map(({ key }) => [key, Array(12).fill(null)]));
// Une part de flux positive dans la référence atteste la compétence de cette population.
POPULATION_STATUTS.forEach(({ key }) => PE_LIST.forEach(({ key: pe }) => {
  if (INIT_FLUX[pe][key].some((v) => v > 0)) INIT_ELIG[key][pe] = 1;
}));

function cleModifiable(ss, pe, elig, modesPE) {
  const population = POPULATION_STATUTS.find(({ key }) => key === ss);
  return elig[ss][pe] === 1 || modesPE[pe] === 'MULTI' || DR.includes(population.site);
}

// Valeurs de départ uniquement : les saisies ne sont jamais remplacées lors d'un changement de mode.
const INIT_FLUX_EDITABLES = JSON.parse(JSON.stringify(INIT_FLUX));
PE_LIST.forEach(({ key: pe }) => {
  POPULATION_STATUTS.filter(({ site }) => DR.includes(site)).forEach(({ key }) => {
    INIT_FLUX_EDITABLES[pe][key] = Array(12).fill(0);
  });
  if (INIT_MODES_PE[pe] !== 'MONO') return;
  const concernees = POPULATION_STATUTS.filter(({ key, site }) => !DR.includes(site) && INIT_ELIG[key][pe] === 1);
  if (new Set(concernees.map(({ site }) => site)).size !== 1) return;
  MOIS.forEach((_, i) => {
    if (POPULATION_STATUTS.some(({ key }) => positive(INIT_FLUX_EDITABLES[pe][key][i]) > 0)) return;
    const capacites = concernees.map(({ population, statut }) => positive(INIT_EFFECTIFS[population][statut][i]) * positive(INIT_HEURES[statut][i]) * Math.min(1, positive(INIT_PRESENCE[statut][i])));
    const total = capacites.reduce((a, v) => a + v, 0);
    concernees.forEach(({ key }, j) => {
      INIT_FLUX_EDITABLES[pe][key][i] = total > 0 ? capacites[j] / total : 1 / concernees.length;
    });
  });
});

function calculerMois(i, effectifs, heures, presence, productivite, appels, elig, flux, repartitionHeures, modesPE = INIT_MODES_PE) {
  const poolSite = Object.fromEntries(SITES.map((s) => [s, 0]));
  const affecteSite = { ...poolSite }, chargeSite = { ...poolSite };
  const poolPopulationStatut = {}, chargePopulation = {}, partsHeures = {}, heuresParPopulationPE = {};
  const capaciteDisponibleParPE = {}, besoinHeures = {}, sitesEligiblesParPE = {}, typeParPE = {}, totalFlux = {};
  // Les heures pilotent l'allocation ; les appels servent à la restitution.
  // Ne jamais convertir le pool global avec une productivité moyenne.
  const besoinAppels = {}, capaciteAppelsParPE = {}, deltaAppelsParPE = {};
  const appelsParPopulationPE = {}, besoinAppelsPopulationPE = {};
  const capaciteAppelsSite = { ...poolSite }, besoinAppelsSite = { ...poolSite };
  const capaciteSiteIncomplete = { ...poolSite }, besoinSiteIncomplet = { ...poolSite };
  const appelsManquants = [], productivitesManquantes = [], capacitesAppelsManquantes = [];
  const fluxEffectif = {};
  const donneesManquantes = [], fluxHorsCompetence = [];
  POPULATION_STATUTS.forEach(({ key: ss, population, statut, site }) => {
    const capacite = positive(effectifs[population][statut][i]) * positive(heures[statut][i]) * Math.min(1, positive(presence[statut][i]));
    poolPopulationStatut[ss] = capacite;
    poolSite[site] += capacite;
  });
  PE_LIST.forEach(({ key }) => {
    const p = productivite[key][i];
    const a = appels[key][i];
    const appelsRenseignes = a !== '' && a !== null && a !== undefined && Number.isFinite(Number(a)) && Number(a) >= 0;
    const productiviteValide = p !== '' && p !== null && p !== undefined && Number.isFinite(Number(p)) && Number(p) > 0;
    const connu = appelsRenseignes && (Number(a) === 0 || productiviteValide);
    besoinAppels[key] = appelsRenseignes ? Number(a) : null;
    if (!appelsRenseignes) appelsManquants.push(key);
    if (!productiviteValide) productivitesManquantes.push(key);
    if (!connu) donneesManquantes.push(key);
    besoinHeures[key] = connu && Number(a) > 0 ? Number(a) / Number(p) : 0;
    capaciteDisponibleParPE[key] = 0;
    totalFlux[key] = 0;
    sitesEligiblesParPE[key] = SITES.filter((s) => POPULATION_STATUTS.some((row) => row.site === s && elig[row.key][key] === 1));
    typeParPE[key] = modesPE[key] || INIT_MODES_PE[key];
    fluxEffectif[key] = {};
    POPULATION_STATUTS.forEach(({ key: ss }) => {
      const eligible = elig[ss][key] === 1;
      const part = flux[key][ss][i];
      fluxEffectif[key][ss] = eligible ? part : 0;
      if (positive(part) > 0 && !eligible) fluxHorsCompetence.push(`${ss} / ${key}`);
      totalFlux[key] += positive(fluxEffectif[key][ss]);
    });
  });
  POPULATION_STATUTS.forEach(({ key: ss, site }) => {
    const capacite = poolPopulationStatut[ss];
    const charge = {};
    PE_LIST.forEach(({ key }) => {
      charge[key] = besoinHeures[key] * positive(fluxEffectif[key][ss]);
    });
    chargePopulation[ss] = charge;
    const chargeTotale = Object.values(charge).reduce((a, v) => a + v, 0);
    chargeSite[site] += chargeTotale;
    const manuel = repartitionHeures[ss][i];
    const partsAuto = Object.fromEntries(PE_LIST.map(({ key }) => [key, chargeTotale > 0 ? charge[key] / chargeTotale : 0]));
    const totalManuel = manuel === null ? 0 : PE_LIST.reduce((total, { key }) => total + (elig[ss][key] === 1 ? positive(manuel[key]) : 0), 0);
    const facteurManuel = totalManuel > 1 ? 1 / totalManuel : 1;
    partsHeures[ss] = {};
    heuresParPopulationPE[ss] = {};
    appelsParPopulationPE[ss] = {};
    besoinAppelsPopulationPE[ss] = {};
    PE_LIST.forEach(({ key }) => {
      const part = elig[ss][key] !== 1 ? 0 : manuel === null ? partsAuto[key] : positive(manuel[key]) * facteurManuel;
      partsHeures[ss][key] = part;
      const h = capacite * part;
      heuresParPopulationPE[ss][key] = h;
      capaciteDisponibleParPE[key] += h;
      affecteSite[site] += h;
      const volume = h === 0 ? 0 : productivitesManquantes.includes(key) ? null : h * Number(productivite[key][i]);
      const partFlux = positive(fluxEffectif[key][ss]);
      const besoin = partFlux === 0 ? 0 : besoinAppels[key] === null ? null : besoinAppels[key] * partFlux;
      appelsParPopulationPE[ss][key] = volume;
      besoinAppelsPopulationPE[ss][key] = besoin;
      capaciteAppelsSite[site] += volume === null ? 0 : volume;
      besoinAppelsSite[site] += besoin === null ? 0 : besoin;
      if (volume === null) capaciteSiteIncomplete[site] = true;
      if (besoin === null) besoinSiteIncomplet[site] = true;
    });
  });
  const capaciteTotale = Object.values(poolSite).reduce((a, v) => a + v, 0);
  const capaciteAffectee = Object.values(capaciteDisponibleParPE).reduce((a, v) => a + v, 0);
  const besoinTotal = Object.values(besoinHeures).reduce((a, v) => a + v, 0);
  PE_LIST.forEach(({ key }) => {
    const h = capaciteDisponibleParPE[key];
    capaciteAppelsParPE[key] = h === 0 ? 0 : productivitesManquantes.includes(key) ? null : h * Number(productivite[key][i]);
    if (capaciteAppelsParPE[key] === null) capacitesAppelsManquantes.push(key);
    deltaAppelsParPE[key] = besoinAppels[key] === null || capaciteAppelsParPE[key] === null
      ? null : capaciteAppelsParPE[key] - besoinAppels[key];
  });
  const besoinTotalAppels = Object.values(besoinAppels).reduce((a, v) => a + (v === null ? 0 : v), 0);
  const capaciteTotaleAppels = Object.values(capaciteAppelsParPE).reduce((a, v) => a + (v === null ? 0 : v), 0);
  const deltaTotalAppels = appelsManquants.length || capacitesAppelsManquantes.length ? null : capaciteTotaleAppels - besoinTotalAppels;
  const besoinNonRepartiAppels = PE_LIST.reduce((total, { key }) => total + positive(besoinAppels[key]) * Math.max(0, 1 - totalFlux[key]), 0);
  return { poolSite, affecteSite, chargeSite, poolPopulationStatut, chargePopulation, partsHeures, heuresParPopulationPE,
    capaciteDisponibleParPE, besoinHeures, sitesEligiblesParPE, typeParPE, totalFlux, donneesManquantes, fluxHorsCompetence,
    fluxEffectif, besoinAppels, capaciteAppelsParPE, deltaAppelsParPE, appelsParPopulationPE, besoinAppelsPopulationPE,
    capaciteAppelsSite, besoinAppelsSite, capaciteSiteIncomplete, besoinSiteIncomplet,
    appelsManquants, productivitesManquantes, capacitesAppelsManquantes,
    besoinTotalAppels, capaciteTotaleAppels, deltaTotalAppels, besoinNonRepartiAppels,
    capaciteTotale, capaciteAffectee, capaciteNonAffectee: Math.max(0, capaciteTotale - capaciteAffectee),
    besoinTotal, deltaNational: capaciteTotale - besoinTotal, deltaAffecte: capaciteAffectee - besoinTotal };
}

function ModeActivite({ pe, mode, onChange }) {

function PercentInput({ value, onChange, label, disabled = false }) {
  const pourcentage = value === null ? '' : Math.round(value * 1000000) / 10000;
  const ajuster = (sens) => {
    if (disabled) return;
    const prochain = Math.max(0, Math.min(100, Math.round((Number(pourcentage) + sens) * 10000) / 10000));
    onChange(prochain / 100);
  };
  return <span className="percent-control">
    <input type="number" min="0" max="100" step="1" aria-label={label} title={label}
      value={pourcentage} disabled={disabled} placeholder="—"
      className="border border-gray-300 rounded px-1 py-0.5 text-xs text-right"
      onKeyDown={(e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); ajuster(e.key === 'ArrowUp' ? 1 : -1); } }}
      onChange={(e) => { const v = e.target.value; if (v === '') onChange(null); else if (Number.isFinite(Number(v)) && Number(v) >= 0 && Number(v) <= 100) onChange(Number(v) / 100); }} />
    <span className="percent-controls">
      <button type="button" disabled={disabled || pourcentage === 100} aria-label={`${label} : augmenter de 1 %`} title="Augmenter de 1 %" onClick={() => ajuster(1)}>▲</button>
      <button type="button" disabled={disabled || pourcentage === 0} aria-label={`${label} : diminuer de 1 %`} title="Diminuer de 1 %" onClick={() => ajuster(-1)}>▼</button>
    </span>
  </span>;
}

const num = (v) => (Number.isFinite(v) ? Math.round(v * 10) / 10 : 0);

function CellInput({ value, onChange, width = 44, allowEmpty = false, label, decimals = null }) {
  const valeurAffichee = value === '' || decimals === null ? value : Number(Number(value).toFixed(decimals));

    <input

        if (allowEmpty && e.target.value === '') { onChange(''); return; }

  const toggleElig = (ss, pe) => setElig((p) => ({ ...p, [ss]: { ...p[ss], [pe]: p[ss][pe] ? 0 : 1 } }));
  const changerMode = (pe, mode) => {
    setModesPE((p) => ({...p, [pe]: mode}));
    setErreurRepartition('');
  };

  const calculs12 = useMemo(() => MOIS.map((m,i) => calculerMois(i,effectifs,heures,presence,productivite,appels,elig,flux,repartitionHeures,modesPE)),
    [effectifs,heures,presence,productivite,appels,elig,flux,repartitionHeures,modesPE]);
  const detailMois = calculs12[moisIdx];
  const synthese12 = calculs12.map((d,i) => ({mois:MOIS[i],capacite:d.capaciteTotaleAppels,besoin:d.besoinTotalAppels,delta:d.deltaTotalAppels,
    capaciteIncomplete:d.capacitesAppelsManquantes.length > 0, besoinIncomplet:d.appelsManquants.length > 0}));
  const setPartHeures = (ss, pe, i, valeur) => {
    if (!cleModifiable(ss, pe, elig, modesPE)) return;
    const parts = {...calculs12[i].partsHeures[ss],[pe]:valeur};
    const total = Object.values(parts).reduce((a,v) => a+v,0);
    // Tolérance limitée à l'arrondi d'affichage (4 décimales en pourcentage).
    if (total > 1.0000005) {
      setErreurRepartition(`${MOIS[i]} : total ${percentText(total)} %. Réduisez d'abord une autre part pour rester à 100 % maximum.`);
      return;
    }
    if (total > 1) parts[pe] = Math.max(0, parts[pe]-(total-1));
    if (positive(parts[pe]) > 0 && elig[ss][pe] !== 1) setElig((p) => ({...p, [ss]: {...p[ss], [pe]: 1}}));
    setRepartitionHeures((p) => ({...p,[ss]:setAt(p[ss],i,parts)}));
    setErreurRepartition('');
  };

  const maxAbs = Math.max(...synthese12.map((s) => Math.max(s.capacite, s.besoin)), 1);
  const lignesFlux = (lignes) => lignes.map(({key:ss, site, name, statut, label}) => (
    <tr key={ss} className={statut === 'CDI' ? 'population-start' : ''}>
      <td>{site}</td>
      <td>{name}</td>
      <td>{statut === 'ALT' ? 'alternants' : statut}</td>
      <td className="text-center"><input type="checkbox" checked={elig[ss][peFlux] === 1} aria-label={`${label}, compétence ${peFlux}`} onChange={() => toggleElig(ss,peFlux)} /></td>
      {MOIS.map((m,i) => <td key={m}><PercentInput value={flux[peFlux][ss][i]} disabled={!cleModifiable(ss,peFlux,elig,modesPE)} label={`${label}, ${peFlux}, ${m}, part du flux en %`} onChange={(v) => setFluxCell(peFlux,ss,i,v)} /></td>)}
    </tr>
  ));

  return (
    <div className="max-w-6xl mx-auto p-4 text-sm space-y-6">
      <div>
        <h2 className="text-lg font-medium mb-1">Dashboard PDM — besoin et capacité attribuée en appels, 2026 ({PE_LIST.length} PE)</h2>
        <p className="text-gray-500 text-xs">Effectifs → Heures disponibles → Répartition entre les PE → Heures attribuées × Productivité du PE (appels/h) = Capacité attribuée en appels.</p>
        <p className="text-gray-500 text-xs">Monosite : ajustez les populations cochées. Multisite : ouvrez la répartition aux autres populations. Les DR restent modifiables dans les deux modes, avec des clés initiales à 0.</p>
      </div>

      <div>
        <h3 className="font-medium mb-2">Vue nationale — Capacité attribuée et besoin en appels, 12 mois</h3>
        <div className="space-y-1">
          {synthese12.map((s) => (
            <div key={s.mois} className="flex items-center gap-2">
              <span className="w-10 text-xs text-gray-500">{s.mois}</span>
              <div className="flex-1 flex gap-0.5 h-4">
                <div className="bg-blue-400 rounded-sm" style={{ width: `${(s.capacite / maxAbs) * 100}%` }} title={`Capacité attribuée${s.capaciteIncomplete ? ' connue (partielle)' : ''} : ${fmtAppels(s.capacite)} appels`} />
              </div>
              <div className="flex-1 flex gap-0.5 h-4">
                <div className="bg-yellow-400 rounded-sm" style={{ width: `${(s.besoin / maxAbs) * 100}%` }} title={`Besoin${s.besoinIncomplet ? ' connu (partiel)' : ''} : ${fmtAppels(s.besoin)} appels`} />
              </div>
              <span className={`w-20 text-right text-xs font-medium ${s.delta === null ? 'text-gray-500' : s.delta >= 0 ? 'text-green-700' : 'text-red-700'}`}>
                {s.delta === null ? 'À compléter' : `${fmtDeltaAppels(s.delta)} appels`}
              </span>
            </div>
          ))}
        </div>
        <div className="flex gap-4 mt-2 text-xs text-gray-500">
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-blue-400 rounded-sm inline-block" />Capacité attribuée (appels)</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-yellow-400 rounded-sm inline-block" />Besoin (appels)</span>
          <span className="flex items-center gap-1 text-green-700"><span className="w-2.5 h-2.5 bg-green-600 rounded-sm inline-block" />Delta positif</span>
          <span className="flex items-center gap-1 text-red-700"><span className="w-2.5 h-2.5 bg-red-500 rounded-sm inline-block" />Delta négatif</span>
        </div>
      </div>

      <div className="flex items-center gap-2">
        <span className="font-medium">Mois détaillé :</span>
        <select aria-label="Mois détaillé" value={moisIdx} onChange={(e) => setMoisIdx(parseInt(e.target.value))} className="border border-gray-300 rounded px-2 py-1 text-sm">
          {MOIS.map((m, i) => <option key={m} value={i}>{m}</option>)}
        </select>
      </div>

      <div className="grid grid-cols-3 gap-3">
        <div className="bg-gray-50 rounded-lg p-3">
          <p className="text-xs text-gray-500">Capacité attribuée{detailMois.capacitesAppelsManquantes.length > 0 ? ' connue (partielle)' : ''} — {MOIS[moisIdx]}</p>
          <p className="text-xl font-medium text-blue-600">{fmtAppels(detailMois.capaciteTotaleAppels)} appels</p>
        </div>
        <div className="bg-gray-50 rounded-lg p-3">
          <p className="text-xs text-gray-500">Besoin{detailMois.appelsManquants.length > 0 ? ' connu (partiel)' : ''} — {MOIS[moisIdx]}</p>
          <p className="text-xl font-medium text-yellow-600">{fmtAppels(detailMois.besoinTotalAppels)} appels</p>
        </div>
        <div className="bg-gray-50 rounded-lg p-3">
          <p className="text-xs text-gray-500">Écart capacité attribuée − besoin — {MOIS[moisIdx]}</p>
          <p className={`text-xl font-medium ${detailMois.deltaTotalAppels === null ? 'text-gray-500' : detailMois.deltaTotalAppels >= 0 ? 'text-green-700' : 'text-red-700'}`}>
            {detailMois.deltaTotalAppels === null ? 'À compléter' : `${fmtDeltaAppels(detailMois.deltaTotalAppels)} appels`}
          </p>
        </div>
      </div>

      <div className="bg-blue-50 rounded p-3 space-y-1">
        <p><strong>Base de calcul :</strong> {fmtHeures(detailMois.capaciteTotale)} h disponibles · {fmtHeures(detailMois.capaciteAffectee)} h attribuées · {fmtHeures(detailMois.capaciteNonAffectee)} h non attribuées.</p>
        <p className="text-xs">Chaque capacité est convertie avec la productivité de son PE pour le mois choisi. Les heures libres ne sont converties qu’après attribution à un PE. Un excédent sur un PE ne couvre pas automatiquement le déficit d’un autre.</p>
        <p className="text-xs">Volumes affichés à l’appel près. Les calculs et les totaux conservent les décimales source ; de petits écarts d’arrondi entre les lignes affichées et leur total sont possibles.</p>
        {detailMois.appelsManquants.length > 0 && <p className="text-yellow-700 text-xs">Besoins en appels à renseigner : {detailMois.appelsManquants.join(', ')}. Le total des besoins est partiel et l’écart national n’est pas calculé.</p>}
        {detailMois.productivitesManquantes.length > 0 && <p className="text-yellow-700 text-xs">Productivité positive à renseigner : {detailMois.productivitesManquantes.join(', ')}. Les besoins saisis en appels restent comptés. La charge en heures et le calcul automatique des parts nécessitent une productivité ; une capacité horaire positive sans productivité est affichée « — » en appels.</p>}
        {PE_LIST.some(({key}) => Math.abs(detailMois.totalFlux[key]-1)>0.000001) && <p className="text-yellow-700 text-xs">Répartition du flux à vérifier (total différent de 100 %) : {PE_LIST.filter(({key}) => Math.abs(detailMois.totalFlux[key]-1)>0.000001).map(({key}) => `${key} (${percentText(detailMois.totalFlux[key])} %)`).join(', ')}.</p>}
        {detailMois.fluxHorsCompetence.length > 0 && <p className="text-red-700 text-xs">{detailMois.fluxHorsCompetence.length} part(s) de flux hors compétence exclue(s). Vérifiez les onglets Flux et Compétences.</p>}
      </div>

      <button className="repartition-launch" onClick={() => {setOngletRepartition('flux'); setRepartitionOuverte(true);}}>Ouvrir les clés de répartition</button>

      <div className="flex gap-2 border-b border-gray-200" style={{flexWrap:'wrap'}}>
        {[
          ['resultats', 'Résultats par PE'],
          ['effectifs', 'Effectifs (matrice 12 mois)'],
          ['productivite', 'Besoins en appels / Productivité (12 mois)'],
          ['competences', 'Compétences (PE × population/statut)'],
        ].map(([id, label]) => (
          <button
            key={id}
            onClick={() => setOngletActif(id)}
            className={`px-3 py-2 text-xs ${ongletActif === id ? 'border-b-2 border-blue-600 font-medium' : 'text-gray-500'}`}
          >
            {label}
          </button>
        ))}
      </div>

      {ongletActif === 'resultats' && (
        <div>
          <p className="text-xs text-gray-400 mb-2">
            Capacité attribuée (appels) = Σ (Effectif × Heures/pers × Présence × Part des heures du PE) × Productivité du PE.
            Besoin = Appels prévus. Écart (appels) = Capacité attribuée − Besoin. La somme des heures attribuées reste limitée aux heures disponibles.
          </p>
          <div className="overflow-x-auto"><table className="border-collapse w-full" aria-label="Résultats par PE en appels">
            <thead>
              <tr className="text-gray-500">
                <th className="text-left pb-1 pr-2 font-normal">PE</th>
                <th className="pb-1 pr-2 font-normal">Besoin (appels)</th>
                <th className="pb-1 pr-2 font-normal">Capacité attribuée (appels)</th>
                <th className="pb-1 pr-2 font-normal">Écart (appels)</th>
                <th className="pb-1 pr-2 font-normal">Productivité (appels/h)</th><th className="pb-1 pr-2 font-normal">Activité</th>
                <th className="pb-1 pr-2 font-normal">Site(s) éligible(s)</th>
              </tr>
            </thead>
            <tbody>
              {PE_LIST.map(({ key, name }) => {
                const deltaInd = detailMois.deltaAppelsParPE[key];
                return (
                  <tr key={key} className="border-t border-gray-100">
                    <td className="py-1 pr-2 font-medium">{name}</td>
                    <td className="py-1 pr-2 text-right text-yellow-700">{fmtAppels(detailMois.besoinAppels[key])}</td>
                    <td className="py-1 pr-2 text-right text-blue-700" title={`${fmtHeures(detailMois.capaciteDisponibleParPE[key])} h attribuées × productivité du PE`}>{fmtAppels(detailMois.capaciteAppelsParPE[key])}</td>
                    <td className={`py-1 pr-2 text-right font-medium ${deltaInd === null ? 'text-gray-500' : deltaInd >= 0 ? 'text-green-700' : 'text-red-700'}`}>
                      {fmtDeltaAppels(deltaInd)}
                    </td>
                    <td className="py-1 pr-2 text-right">{detailMois.productivitesManquantes.includes(key) ? '—' : Number(productivite[key][moisIdx]).toLocaleString('fr-FR', {maximumFractionDigits: 6})}</td>
                    <td className="py-1 pr-2">
                      <ModeActivite pe={key} mode={modesPE[key]} onChange={changerMode} />
                    </td>
                    <td className="py-1 pr-2 text-gray-500">{detailMois.sitesEligiblesParPE[key].join(', ') || '—'}</td>
                  </tr>
                );
              })}
              <tr className="border-t-2 bg-gray-50">
                <th className="text-left py-2">Total{detailMois.deltaTotalAppels === null ? ' connu (partiel)' : ''}</th>
                <td className="text-right pr-2 font-medium">{fmtAppels(detailMois.besoinTotalAppels)}</td>
                <td className="text-right pr-2 font-medium">{fmtAppels(detailMois.capaciteTotaleAppels)}</td>
                <td className="text-right pr-2 font-medium">{fmtDeltaAppels(detailMois.deltaTotalAppels)}</td>
                <td colSpan={3} />
              </tr>
            </tbody>
          </table></div>

          <h3 className="font-medium mt-4 mb-2">Synthèse par site — {MOIS[moisIdx]}</h3>
          <p className="text-xs text-gray-500 mb-2">La capacité d’un site est la somme des appels attribués à ses PE. Le besoin reçu dépend des clés de flux. Besoin restant à répartir : {fmtAppels(detailMois.besoinNonRepartiAppels)} appels. Les clés de chaque PE doivent totaliser 100 % pour rapprocher les besoins par site du besoin national.</p>
          <div className="overflow-x-auto"><table className="w-full text-xs" aria-label="Synthèse par site en appels"><thead><tr><th className="text-left">Site</th><th>Besoin reçu (appels)</th><th>Capacité attribuée (appels)</th><th>Écart (appels)</th><th>Heures non attribuées</th></tr></thead>
            <tbody>{SITES.map((s) => {
              const besoin = detailMois.besoinSiteIncomplet[s] ? null : detailMois.besoinAppelsSite[s];
              const capacite = detailMois.capaciteSiteIncomplete[s] ? null : detailMois.capaciteAppelsSite[s];
              return <tr key={s} className="border-t"><td>{s}</td><td className="text-right">{fmtAppels(besoin)}</td><td className="text-right">{fmtAppels(capacite)}</td><td className="text-right">{fmtDeltaAppels(besoin === null || capacite === null ? null : capacite-besoin)}</td><td className="text-right">{fmtHeures(Math.max(0,detailMois.poolSite[s]-detailMois.affecteSite[s]))} h</td></tr>;
            })}</tbody>
          </table></div>
          <details className="mt-4">
            <summary className="font-medium">Capacités attribuées par site et par PE (appels)</summary>
            <div className="overflow-x-auto"><table className="w-full text-xs" aria-label="Capacités en appels par site et PE">
              <thead><tr><th className="text-left pr-2">PE</th>{SITES.map((s) => <th key={s}>{s}</th>)}<th>Total</th></tr></thead>
              <tbody>{PE_LIST.map(({key,name}) => <tr key={key} className="border-t"><td className="pr-2 whitespace-nowrap">{name}</td>{SITES.map((s) => {
                const volumes = POPULATION_STATUTS.filter(({site}) => site === s).map(({key:ss}) => detailMois.appelsParPopulationPE[ss][key]);
                return <td key={s} className="text-right">{fmtAppels(volumes.includes(null) ? null : volumes.reduce((a,v) => a+v,0))}</td>;
              })}<td className="text-right font-medium">{fmtAppels(detailMois.capaciteAppelsParPE[key])}</td></tr>)}</tbody>
            </table></div>
          </details>
        </div>
      )}

      <dialog ref={repartitionDialog} className="repartition-dialog" aria-labelledby="repartition-title" onCancel={() => setRepartitionOuverte(false)} onClose={() => setRepartitionOuverte(false)}>
        <div className="repartition-header">
          <div><h2 id="repartition-title">Clés de répartition — 2026</h2><p className="text-xs text-gray-500">Les modifications actualisent directement les résultats du plan de marche.</p></div>
          <button className="border rounded px-3 py-2" onClick={() => setRepartitionOuverte(false)} aria-label="Fermer les répartitions">Fermer ×</button>
        </div>
        <div className="flex gap-2 border-b mb-2" role="tablist" aria-label="Type de répartition">
          {[['flux','Clés de répartition du flux (%)'],['repartition','Répartition des heures (%)']].map(([key,label]) => <button key={key} role="tab" aria-selected={ongletRepartition===key} className={`px-3 py-2 ${ongletRepartition===key ? 'border-b-2 text-blue-700 font-medium' : 'text-gray-500'}`} onClick={() => setOngletRepartition(key)}>{label}</button>)}
        </div>
        <div className="repartition-content">
      {ongletRepartition === 'flux' && (
        <div className="space-y-4 overflow-x-auto">
          <div className="activity-settings">
            <label>Point d’entrée : <select aria-label="PE des clés de répartition" className="border rounded px-2 py-1" value={peFlux} onChange={(e) => setPeFlux(e.target.value)}>{PE_LIST.map(({key,name}) => <option key={key} value={key}>{name}</option>)}</select></label>
            <ModeActivite pe={peFlux} mode={modesPE[peFlux]} onChange={changerMode} />
          </div>
          <div className="bg-blue-50 rounded p-3" role="status">
            <p className="font-medium">{modesPE[peFlux] === 'MONO' ? 'Monosite — populations cochées modifiables' : 'Multisite — toutes les populations modifiables'}</p>
            <p>{modesPE[peFlux] === 'MONO'
              ? 'Ajustez librement les clés des populations cochées. Vous pouvez cocher une autre population pour l’inclure dans la répartition.'
              : 'Ajustez les clés de toutes les populations. Saisir une part positive coche automatiquement la compétence pour inclure cette population dans les calculs.'}</p>
            <p className="text-xs text-gray-500">Les DR restent ouverts à la saisie dans les deux modes et démarrent à 0. Une saisie positive active leur compétence. Changer de mode conserve les coches et les valeurs saisies.</p>
          </div>
          <table className="cles-table border-collapse text-xs" aria-label={`Clés mensuelles de ${PE_LIST.find((pe) => pe.key === peFlux).name}`}>
            <thead><tr><th className="text-left">Site</th><th className="text-left">Population</th><th className="text-left">Statut</th><th>Compétence</th>{MOIS.map((m) => <th key={m}>{m} (%)</th>)}</tr></thead>
            <tbody>
              {lignesFlux(POPULATION_STATUTS)}
              <tr className="border-t bg-gray-50"><th colSpan={4} className="text-left">Total du PE — toutes populations compétentes</th>{calculs12.map((d,i) => <td key={i} className={`text-right ${Math.abs(d.totalFlux[peFlux]-1) > 0.000001 ? 'text-red-700' : 'text-green-700'}`}>{percentText(d.totalFlux[peFlux])} %</td>)}</tr>
              <tr><th colSpan={4} className="text-left">Écart à 100 % (+ manquant / − dépassement)</th>{calculs12.map((d,i) => <td key={i} className="text-right">{percentText(1-d.totalFlux[peFlux])} %</td>)}</tr>
            </tbody>
          </table>
          <p className="text-xs text-gray-500">Toutes les populations sont affichées. Le total des populations cochées doit atteindre 100 % chaque mois. Décocher une population conserve ses valeurs, mais les exclut des calculs. Les clés proposées au départ pour les PE monosite sont entièrement modifiables.</p>
        </div>
      )}

      {ongletRepartition === 'repartition' && (
        <div className="space-y-4 overflow-x-auto">
          <p>Par défaut, les heures disponibles d’une population sont partagées entre ses PE au prorata de leur charge reçue. Vous pouvez modifier les parts en monosite comme en multisite : le mode Monosite ouvre les populations cochées, le mode Multisite ouvre aussi les autres. Les DR restent modifiables dans les deux modes.</p>
          <label>Population / statut : <select aria-label="Population des heures" className="border rounded px-2 py-1" value={populationHeures} onChange={(e) => {setPopulationHeures(e.target.value); setErreurRepartition('');}}>{POPULATION_STATUTS.map(({key,label}) => <option key={key} value={key}>{label}</option>)}</select></label>
          <p className="text-xs text-gray-500">Modifier une case fixe la répartition de ce mois en mode manuel. Une part positive active la compétence si nécessaire. Le total ne peut pas dépasser 100 % : réduisez d’abord une autre part pour libérer des heures. Un total inférieur à 100 % laisse des heures non attribuées. Changer Monosite / Multisite conserve vos répartitions.</p>
          {erreurRepartition && <p role="alert" className="text-red-700">{erreurRepartition}</p>}
          <table className="border-collapse text-xs">
            <thead><tr><th className="text-left pr-2">PE</th>{MOIS.map((m) => <th key={m} className="px-1">{m} (%)</th>)}</tr></thead>
            <tbody>
              <tr className="bg-gray-50"><th className="text-left">Mode</th>{MOIS.map((m,i) => <td key={m} className="text-center">{repartitionHeures[populationHeures][i] === null ? 'Auto' : <button className="text-blue-700" title={`Revenir au calcul automatique pour ${m}`} onClick={() => {setRepartitionHeures((p) => ({...p,[populationHeures]:setAt(p[populationHeures],i,null)}));setErreurRepartition('');}}>Manuel ↺ Auto</button>}</td>)}</tr>
              {PE_LIST.map(({key,name}) => <tr key={key}><td className="pr-2 whitespace-nowrap">{name}</td>{MOIS.map((m,i) => <td key={m} className="px-1 py-0.5"><PercentInput value={calculs12[i].partsHeures[populationHeures][key]} disabled={!cleModifiable(populationHeures,key,elig,modesPE)} label={`${name}, ${m}, part des heures en %`} onChange={(v) => setPartHeures(populationHeures,key,i,v || 0)} /></td>)}</tr>)}
              <tr className="border-t bg-gray-50"><th className="text-left">Total des heures réparties (%)</th>{calculs12.map((d,i) => <td key={i} className="text-right px-1">{percentText(Object.values(d.partsHeures[populationHeures]).reduce((a,v) => a+v,0))} %</td>)}</tr>
              <tr><th className="text-left">Heures disponibles</th>{calculs12.map((d,i) => <td key={i} className="text-right px-1">{fmtHeures(d.poolPopulationStatut[populationHeures])}</td>)}</tr>
              <tr><th className="text-left">Heures non attribuées</th>{calculs12.map((d,i) => <td key={i} className="text-right px-1">{fmtHeures(Math.max(0,d.poolPopulationStatut[populationHeures]-Object.values(d.heuresParPopulationPE[populationHeures]).reduce((a,v) => a+v,0)))}</td>)}</tr>
            </tbody>
          </table>
          <h3>Détail — {MOIS[moisIdx]} 2026</h3>
          <p className="text-xs text-gray-500">La capacité en appels de cette population utilise les heures attribuées et la productivité de chaque PE. Les heures restent visibles ici pour contrôler leur répartition.</p>
          <table className="w-full text-xs" aria-label="Détail de la répartition en appels"><thead><tr><th className="text-left">PE</th><th>Flux reçu (%)</th><th>Besoin reçu (appels)</th><th>Part des heures (%)</th><th>Heures attribuées</th><th>Capacité attribuée (appels)</th><th>Écart (appels)</th></tr></thead>
            <tbody>{PE_LIST.map(({key,name}) => {
              const besoin = detailMois.besoinAppelsPopulationPE[populationHeures][key];
              const capacite = detailMois.appelsParPopulationPE[populationHeures][key];
              return <tr key={key} className="border-t"><td>{name}</td><td className="text-right">{detailMois.fluxEffectif[key][populationHeures] === null ? '—' : percentText(detailMois.fluxEffectif[key][populationHeures])}</td><td className="text-right">{fmtAppels(besoin)}</td><td className="text-right">{percentText(detailMois.partsHeures[populationHeures][key])}</td><td className="text-right">{fmtHeures(detailMois.heuresParPopulationPE[populationHeures][key])}</td><td className="text-right">{fmtAppels(capacite)}</td><td className="text-right">{fmtDeltaAppels(besoin === null || capacite === null ? null : capacite-besoin)}</td></tr>;
            })}</tbody>
          </table>
        </div>
      )}

        </div>
      </dialog>

      {ongletActif === 'effectifs' && (
        <div className="space-y-4 overflow-x-auto">
          <p className="text-xs text-gray-400">{POPULATIONS.length} populations, soit {POPULATION_STATUTS.length} lignes. Chaque DR comprend les pôles AC (CDI, CDD et alternants) et le réseau commercial (CDI). Capacité du site = somme des capacités de ses populations (Effectif × Heures/pers × Présence). Les heures et taux de présence restent communs par statut.</p>
          {POPULATIONS.map(({ key: population, site, name, statuts }) => (
            <div key={population}>
              <p className="font-medium mb-1">{site === name ? name : `${site} / ${name}`}</p>
              <table className="border-collapse text-xs">
                <thead>
                  <tr>
                    <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Site / Population / Statut</th>
                    {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {statuts.map((st) => (
                    <tr key={st}>
                      <td className="pr-2 py-0.5 font-medium whitespace-nowrap">{POPULATION_STATUTS.find((row) => row.population === population && row.statut === st).label}</td>
                      {MOIS.map((m, i) => (
                        <td key={m} className="px-0.5 py-0.5">
                          <CellInput value={effectifs[population][st][i]} onChange={(v) => setEffCell(population, st, i, v)} />
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
          <div>
            <p className="font-medium mb-1">Heures productives / personne</p>
            <table className="border-collapse text-xs">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Statut</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {STATUTS.map((st) => (
                  <tr key={st}>
                    <td className="pr-2 py-0.5 font-medium">{st}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <CellInput value={heures[st][i]} onChange={(v) => setHeuresCell(st, i, v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div>
            <p className="font-medium mb-1">Taux de présence (%)</p>
            <table className="border-collapse text-xs">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Statut</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {STATUTS.map((st) => (
                  <tr key={st}>
                    <td className="pr-2 py-0.5 font-medium">{st}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <PercentInput value={presence[st][i]} label={`${st}, ${m}, taux de présence en %`} onChange={(v) => setPresenceCell(st, i, v === null ? 0 : v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {ongletActif === 'productivite' && (
        <div className="space-y-4 overflow-x-auto">
          <div className="bg-blue-50 rounded p-3 space-y-1">
            <p className="font-medium">Besoin = nombre d’appels prévus · Capacité attribuée = heures attribuées × productivité du PE</p>
            <p>La productivité correspond au nombre d’appels traités par heure. Le besoin reste en appels lorsque la productivité change ; la charge en heures et la capacité en appels sont recalculées.</p>
            <p className="text-xs text-gray-500">Volumes initiaux : {SOURCE_BESOINS.fichier}, onglet {SOURCE_BESOINS.feuille}, ligne « {SOURCE_BESOINS.serie} ». Pour partager les heures en mode automatique, la charge est calculée avec Appels ÷ Productivité × Part du flux.</p>
          </div>
          <div>
            <p className="font-medium mb-1">Besoins mensuels (appels)</p>
            <table className="border-collapse text-xs" aria-label="Besoins mensuels en appels">
              <thead><tr><th className="text-left pr-2 pb-1">PE</th>{MOIS.map((m) => <th key={m} className="px-1 pb-1">{m}</th>)}</tr></thead>
              <tbody>
                {PE_LIST.map(({key,name}) => <tr key={key} className="border-t">
                  <td className="pr-2 py-1 font-medium whitespace-nowrap">{name}</td>
                  {calculs12.map((d,i) => <td key={i} className="px-1 py-1 text-right text-yellow-700" title={d.appelsManquants.includes(key) ? 'Renseignez le nombre d’appels prévus.' : `${fmtAppels(d.besoinAppels[key])} appels prévus. La productivité ne modifie pas le volume du besoin.`}>
                    {fmtAppels(d.besoinAppels[key])}
                  </td>)}
                </tr>)}
                <tr className="border-t bg-gray-50"><th className="text-left pr-2 py-1">Total des besoins connus (appels)</th>{calculs12.map((d,i) => <td key={i} className="px-1 py-1 text-right font-medium">{fmtAppels(d.besoinTotalAppels)}{d.appelsManquants.length > 0 ? ' *' : ''}</td>)}</tr>
              </tbody>
            </table>
          </div>
          {calculs12.some((d) => d.appelsManquants.length > 0) && <p role="status" className="text-yellow-700 text-xs">Les cases « — » signalent des besoins en appels manquants. * : total partiel. Une productivité absente ou nulle ne retire pas du total un besoin en appels renseigné.</p>}
          <div>
            <p className="font-medium mb-1">Capacités attribuées mensuelles (appels)</p>
            <table className="border-collapse text-xs" aria-label="Capacités mensuelles en appels">
              <thead><tr><th className="text-left pr-2 pb-1">PE</th>{MOIS.map((m) => <th key={m} className="px-1 pb-1">{m}</th>)}</tr></thead>
              <tbody>{PE_LIST.map(({key,name}) => <tr key={key} className="border-t"><td className="pr-2 py-1 font-medium whitespace-nowrap">{name}</td>{calculs12.map((d,i) => <td key={i} className="px-1 py-1 text-right text-blue-700">{fmtAppels(d.capaciteAppelsParPE[key])}</td>)}</tr>)}
                <tr className="border-t bg-gray-50"><th className="text-left pr-2 py-1">Total des capacités connues (appels)</th>{calculs12.map((d,i) => <td key={i} className="px-1 py-1 text-right font-medium">{fmtAppels(d.capaciteTotaleAppels)}{d.capacitesAppelsManquantes.length > 0 ? ' *' : ''}</td>)}</tr>
              </tbody>
            </table>
            <p className="text-xs text-gray-500">Capacité par PE = heures attribuées × productivité du mois. « — » : heures attribuées mais productivité non renseignée ou nulle. * : total partiel.</p>
          </div>
          <div>
            <p className="font-medium mb-1">Productivité — nombre d’appels traités par heure</p>
            <table className="border-collapse text-xs" aria-label="Productivités en appels par heure">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">PE</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {PE_LIST.map(({ key, name }) => (
                  <tr key={key}>
                    <td className="pr-2 py-0.5 font-medium">{name}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <CellInput value={productivite[key][i]} allowEmpty label={`${name}, ${m}, productivité en appels par heure`} onChange={(v) => setProdCell(key, i, v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <details>
            <summary className="font-medium mb-1">Besoins source en appels — valeurs modifiables</summary>
            <p className="text-xs text-gray-500">Source : {SOURCE_BESOINS.fichier} / {SOURCE_BESOINS.feuille}, colonnes B à M, janvier à décembre {SOURCE_BESOINS.annee}. Les appels sont affichés sans décimale, comme dans Excel. Les calculs conservent la précision du fichier. AMHAUD est repris une seule fois, dans le bloc B222:M222.</p>
            <p className="text-xs text-gray-500">Pour TLV EPI, TLV SPE2 et SPE2, le total annuel du classeur diffère d’un appel de la somme des mois. Les calculs de la maquette utilisent les valeurs mensuelles.</p>
            <table className="border-collapse text-xs" aria-label="Besoins source en appels">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">PE</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {PE_LIST.map(({ key, name }) => (
                  <tr key={key}>
                    <td className="pr-2 py-0.5 font-medium" title={`${SOURCE_BESOINS.feuille}!B${SOURCE_BESOINS.lignes[key]}:M${SOURCE_BESOINS.lignes[key]}`}>{name}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <CellInput value={appels[key][i]} decimals={0} allowEmpty label={`${name}, ${m}, nombre d’appels`} onChange={(v) => setAppelsCell(key, i, v)} width={88} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </details>
        </div>
      )}

      {ongletActif === 'competences' && (
        <div className="overflow-x-auto">
          <p className="text-xs text-gray-400 mb-2">
            Les compétences indiquent les PE autorisés pour chaque population et statut. Une coche ne réserve aucune heure à elle seule : l’affectation dépend de la répartition du flux et des heures.
            Les parts positives du classeur ont été ajoutées aux compétences initiales. Décocher un PE exclut son flux et ses heures ; les pourcentages saisis sont conservés. Une population cochée reste modifiable en monosite. En multisite et pour les DR, une nouvelle part positive active automatiquement la compétence. Changer de mode ne modifie ni les coches ni les répartitions.
          </p>
          <table className="border-collapse text-xs">
            <thead>
              <tr>
                <th className="text-left pr-2 pb-1 text-gray-500 font-normal sticky left-0 bg-white">Site / Population / Statut</th>
                {PE_LIST.map(({ key, name }) => <th key={key} className="px-1 pb-1 text-gray-500 font-normal" title={name}>{key}</th>)}
              </tr>
            </thead>
            <tbody>
              {POPULATION_STATUTS.map(({ key: ss, label }) => (
                <tr key={ss}>
                  <td className="pr-2 py-0.5 font-medium sticky left-0 bg-white whitespace-nowrap">{label}</td>
                  {PE_LIST.map(({ key }) => (
                    <td key={key} className="text-center px-1 py-0.5">
                      <input type="checkbox" checked={elig[ss][key] === 1} onChange={() => toggleElig(ss, key)} />
                    </td>
                  ))}
                </tr>
              ))}
              <tr className="border-t-2 border-gray-400 bg-blue-50">
                <td className="pr-2 py-1 font-medium sticky left-0 bg-blue-50">Capacité attribuée (appels) — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({ key }) => (
                  <td key={key} className="text-center px-1 py-1 font-medium text-blue-700">{fmtAppels(detailMois.capaciteAppelsParPE[key])}</td>
                ))}
              </tr>
              <tr className="bg-yellow-50">
                <td className="pr-2 py-1 font-medium sticky left-0 bg-yellow-50">Besoin (appels) — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({ key }) => (
                  <td key={key} className="text-center px-1 py-1 text-yellow-700">{fmtAppels(detailMois.besoinAppels[key])}</td>
                ))}
              </tr>
              <tr>
                <td className="pr-2 py-1 font-medium sticky left-0 bg-white">Écart (appels) — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({ key }) => {
                  const d = detailMois.deltaAppelsParPE[key];
                  return <td key={key} className={`text-center px-1 py-1 font-medium ${d === null ? 'text-gray-500' : d >= 0 ? 'text-green-700' : 'text-red-700'}`}>{fmtDeltaAppels(d)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      )}
      
      

      <p className="text-xs text-gray-400">
        {PE_LIST.length} PE et {POPULATIONS.length} populations. Les cases vides du classeur restent à compléter. Les modifications de cette page restent en mémoire jusqu’au rechargement.
      </p>

      <footer className="text-xs text-gray-500 text-center border-t pt-4">
        Yann Kahia — Chef de pilotage téléphonie commerciale — Tous droits réservés
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
</body>
</html>
