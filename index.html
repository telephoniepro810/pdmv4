// Les pourcentages Excel portent sur le flux du PE, pas sur les heures de la population.

// Les DR ne traitent initialement aucun flux ; leur participation est simulable pour tout PE.
PE_LIST.forEach(({ key: pe }) => {
  POPULATION_STATUTS.filter(({site}) => DR.includes(site)).forEach(({key}) => {
    INIT_FLUX[pe][key] = Array(12).fill(0);
  });
});
// Les clés portent sur les prévisions d'appels, jamais sur la capacité.
const positive = (v) => Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0;
const percentText = (v) => (v * 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const sommeComplete = (values) => values.some((v) => v === null) ? null : values.reduce((a, v) => a + v, 0);
// Une part de flux positive dans la référence atteste la compétence de cette population.
POPULATION_STATUTS.forEach(({ key }) => PE_LIST.forEach(({ key: pe }) => {
  if (INIT_FLUX[pe][key].some((v) => v > 0)) INIT_ELIG[key][pe] = 1;
}));

function cleModifiable(ss, pe, elig, modesPE) {
  const population = POPULATION_STATUTS.find(({ key }) => key === ss);
  return elig[ss][pe] === 1 || modesPE[pe] === 'MULTI' || DR.includes(population.site);
}

// Valeurs de départ uniquement : les saisies ne sont jamais remplacées lors d'un changement de mode.
const INIT_FLUX_EDITABLES = JSON.parse(JSON.stringify(INIT_FLUX));
PE_LIST.forEach(({ key: pe }) => {
  POPULATION_STATUTS.filter(({ site }) => DR.includes(site)).forEach(({ key }) => {
    INIT_FLUX_EDITABLES[pe][key] = Array(12).fill(0);
  });
  if (INIT_MODES_PE[pe] !== 'MONO') return;
  const concernees = POPULATION_STATUTS.filter(({ key, site }) => !DR.includes(site) && INIT_ELIG[key][pe] === 1);
  if (new Set(concernees.map(({ site }) => site)).size !== 1) return;
  MOIS.forEach((_, i) => {
    if (POPULATION_STATUTS.some(({ key }) => positive(INIT_FLUX_EDITABLES[pe][key][i]) > 0)) return;
    const capacites = concernees.map(({ population, statut }) => positive(INIT_EFFECTIFS[population][statut][i]) * positive(INIT_HEURES[statut][i]) * Math.min(1, positive(INIT_PRESENCE[statut][i])));
    const total = capacites.reduce((a, v) => a + v, 0);
    concernees.forEach(({ key }, j) => {
      INIT_FLUX_EDITABLES[pe][key][i] = total > 0 ? capacites[j] / total : 1 / concernees.length;
    });
  });
});

function calculerMois(i, effectifs, heures, presence, productivite, appels, elig, flux, modesPE = INIT_MODES_PE) {
  const besoinAppels = {}, besoinHeures = {}, totalFlux = {}, fluxEffectif = {}, typeParPE = {};
  const appelsManquants = [], productivitesManquantes = [], fluxHorsCompetence = [];
  const populations = {}, parPE = {}, parSite = {};
  PE_LIST.forEach(({key}) => {
    const a = appels[key][i], p = productivite[key][i];
    const appelValide = a !== '' && a !== null && a !== undefined && Number.isFinite(Number(a)) && Number(a) >= 0;
    const prodValide = positive(p) > 0;
    besoinAppels[key] = appelValide ? Number(a) : null;
    besoinHeures[key] = !appelValide ? null : Number(a) === 0 ? 0 : prodValide ? Number(a) / Number(p) : null;
    if (!appelValide) appelsManquants.push(key);
    if (!prodValide) productivitesManquantes.push(key);
    typeParPE[key] = modesPE[key] || INIT_MODES_PE[key];
    fluxEffectif[key] = {};
    POPULATION_STATUTS.forEach(({key:ss}) => {
      const part = positive(flux[key][ss][i]);
      fluxEffectif[key][ss] = elig[ss][key] === 1 ? part : 0;
      if (part > 0 && elig[ss][key] !== 1) fluxHorsCompetence.push(`${ss} / ${key}`);
    });
    totalFlux[key] = sommeComplete(Object.values(fluxEffectif[key]));
  });
  POPULATION_STATUTS.forEach(({key:ss, population, statut}) => {
    const capacite = positive(effectifs[population][statut][i]) * positive(heures[statut][i]) * Math.min(1, positive(presence[statut][i]));
    const lignes = {};
    // L'attribution est indépendante des heures disponibles et de la productivité.
    PE_LIST.forEach(({key}) => {
      const part = fluxEffectif[key][ss];
      // Appliquer exactement la clé saisie, même pendant un ajustement au-delà de 100 %.
      // Le total et son écart à la prévision sont affichés ; aucune normalisation.
      const attribues = part === 0 ? 0 : besoinAppels[key] === null ? null : besoinAppels[key] * part;
      const charge = attribues === 0 ? 0 : attribues === null || productivitesManquantes.includes(key)
        ? null : attribues / Number(productivite[key][i]);
      lignes[key] = {attribues, charge};
    });
    const sommeLignes = (champ, mode) => sommeComplete(PE_LIST.filter(({key}) => !mode || typeParPE[key] === mode).map(({key}) => lignes[key][champ]));
    const charge = sommeLignes('charge');
    const chargeMono = sommeLignes('charge','MONO');
    populations[ss] = {capacite, lignes, attribues: sommeLignes('attribues'), charge,
      chargeMono, chargeMulti: sommeLignes('charge','MULTI'),
      restantApresMono: chargeMono === null ? null : Math.max(0,capacite-chargeMono),
      delta: charge === null ? null : charge-capacite,
      libres: charge === null ? null : Math.max(0,capacite-charge),
      deficit: charge === null ? null : Math.max(0,charge-capacite)};
  });
  PE_LIST.forEach(({key}) => {
    const lignes = POPULATION_STATUTS.map(({key:ss}) => populations[ss].lignes[key]);
    const attribues = sommeComplete(lignes.map(l=>l.attribues));
    parPE[key] = {prevision: besoinAppels[key], attribues,
      nonRepartis: attribues === null || besoinAppels[key] === null ? null : Math.max(0,besoinAppels[key]-attribues),
      ecartPrevision: attribues === null || besoinAppels[key] === null ? null : attribues-besoinAppels[key],
      charge: sommeComplete(lignes.map(l=>l.charge))};
  });
  const sommer = (lignes) => Object.fromEntries(['capacite','attribues','charge','chargeMono','chargeMulti','restantApresMono','delta','libres','deficit']
    .map(champ=>[champ,sommeComplete(lignes.map(l=>l[champ]))]));
  SITES.forEach(site => {
    const lignesSite = POPULATION_STATUTS.filter(r=>r.site===site).map(({key:ss})=>populations[ss]);
    parSite[site] = {
      ...sommer(lignesSite),
      parPE: Object.fromEntries(PE_LIST.map(({key}) => [key, {
        attribues: sommeComplete(lignesSite.map(p=>p.lignes[key].attribues)),
      }])),
    };
  });
  const national = sommer(Object.values(populations));
  national.prevision = sommeComplete(Object.values(besoinAppels));
  national.attribues = sommeComplete(Object.values(parPE).map(l=>l.attribues));
  national.nonRepartis = sommeComplete(Object.values(parPE).map(l=>l.nonRepartis));
  national.ecartPrevision = national.attribues === null || national.prevision === null ? null : national.attribues-national.prevision;
  return {besoinAppels, besoinHeures, totalFlux, fluxEffectif, typeParPE, populations, parPE, parSite, national,
    appelsManquants, productivitesManquantes, fluxHorsCompetence};
}

function PercentInput({ value, onChange, label, disabled = false }) {
  const pourcentage = value === null ? '' : Math.round(value * 1000000) / 10000;
  const ajuster = (sens) => {
    if (disabled) return;
    const prochain = Math.max(0, Math.min(100, Math.round((Number(pourcentage) + sens) * 10000) / 10000));
    onChange(prochain / 100);
  };
  return <span className="percent-control">
    <input type="number" min="0" max="100" step="1" aria-label={label} title={label}
      value={pourcentage} disabled={disabled} placeholder="—"
      className="border border-gray-300 rounded px-1 py-0.5 text-xs text-right"
      onKeyDown={(e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); ajuster(e.key === 'ArrowUp' ? 1 : -1); } }}
      onChange={(e) => { const v = e.target.value; if (v === '') onChange(null); else if (Number.isFinite(Number(v)) && Number(v) >= 0 && Number(v) <= 100) onChange(Number(v) / 100); }} />
    <span className="percent-controls">
      <button type="button" disabled={disabled || pourcentage === 100} aria-label={`${label} : augmenter de 1 %`} title="Augmenter de 1 %" onClick={() => ajuster(1)}>▲</button>
      <button type="button" disabled={disabled || pourcentage === 0} aria-label={`${label} : diminuer de 1 %`} title="Diminuer de 1 %" onClick={() => ajuster(-1)}>▼</button>
    </span>
  </span>;
}

const num = (v) => (Number.isFinite(v) ? Math.round(v * 10) / 10 : 0);
const fmt = (v) => num(v).toLocaleString('fr-FR');
const fmtAppels = (v) => v === null || v === undefined || !Number.isFinite(Number(v)) ? '—' : Math.round(Number(v)).toLocaleString('fr-FR');
const fmtEcartAppels = (v) => v === null || !Number.isFinite(v) ? '—' : `${Math.round(v) > 0 ? '+' : ''}${fmtAppels(v)}`;
const fmtHeures = (v) => v === null || !Number.isFinite(v) ? '—' : v.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const fmtDeltaHeures = (v) => v === null || !Number.isFinite(v) ? '—' : `${Math.round(v*100) > 0 ? '+' : ''}${fmtHeures(Math.round(v*100)/100)}`;
const couleurDelta = (v) => v === null ? 'text-gray-500' : v > 1e-9 ? 'text-red-700' : 'text-green-700';

function CellInput({ value, onChange, width = 44, allowEmpty = false, label, decimals = null }) {
  const valeurAffichee = value === '' || decimals === null ? value : Number(Number(value).toFixed(decimals));
  return (
    <input
      type="number"
      value={valeurAffichee}
      aria-label={label}
      onChange={(e) => {
        if (allowEmpty && e.target.value === '') { onChange(''); return; }
        const nombre = positive(e.target.value);
        onChange(decimals === null ? nombre : Number(nombre.toFixed(decimals)));
      }}
      style={{ width }}
      min="0"
      step={decimals === null ? 'any' : 10 ** -decimals}
      className="border border-gray-300 rounded px-1 py-0.5 text-xs text-right"
    />
  );
}

function setAt(arr, i, v) {
  const copy = [...arr];
  copy[i] = v;
  return copy;
}

function peDuSite(site, elig) {
  const populations = POPULATION_STATUTS.filter(p => p.site === site);
  return PE_LIST.filter(({key}) => populations.some(p => elig[p.key][key] === 1));
}

// Conversion de la capacité horaire selon la répartition automatique de l'ancienne maquette.
// Les heures d'une population sont partagées entre ses PE au prorata de leur charge.
function calculerCapacitesAppels(detail, productivite, mois) {
  const populations = {};
  POPULATION_STATUTS.forEach(({key:ss}) => {
    const population = detail.populations[ss];
    const parPE = Object.fromEntries(PE_LIST.map(({key}) => {
      const charge = population.lignes[key].charge;
      const heures = population.capacite === 0 || charge === 0 ? 0
        : population.charge === null ? null
        : population.capacite * charge / population.charge;
      const appels = heures === 0 ? 0 : heures === null || positive(productivite[key][mois]) === 0
        ? null : heures * Number(productivite[key][mois]);
      return [key, {heures, appels}];
    }));
    populations[ss] = {
      parPE,
      heuresNonAffectees: population.capacite === 0 ? 0 : population.charge === null ? null
        : population.charge === 0 ? population.capacite : 0,
    };
  });
  const agreger = lignes => {
    const parPE = Object.fromEntries(PE_LIST.map(({key}) => [key, {
      heures: sommeComplete(lignes.map(p => p.parPE[key].heures)),
      appels: sommeComplete(lignes.map(p => p.parPE[key].appels)),
    }]));
    return {
      parPE,
      totalAppels: sommeComplete(PE_LIST.map(({key}) => parPE[key].appels)),
      heuresAffectees: sommeComplete(PE_LIST.map(({key}) => parPE[key].heures)),
      heuresNonAffectees: sommeComplete(lignes.map(p => p.heuresNonAffectees)),
    };
  };
  return {
    populations,
    national: agreger(Object.values(populations)),
    parSite: Object.fromEntries(SITES.map(site => [site, agreger(POPULATION_STATUTS.filter(p => p.site === site).map(p => populations[p.key]))])),
  };
}

        <tfoot><tr><th scope="row">Capacité totale (appels)</th>{capacites.map((c,i) => <td key={i}>{fmtAppels(c.totalAppels)}</td>)}
          <td>{fmtAppels(sommeComplete(capacites.map(c => c.totalAppels)))}</td></tr></tfoot>
      </table>
    </div>
  </section>;
}

        <div className="site-table-scroll" role="region" aria-label={`Tableau mensuel des appels ${site}`} tabIndex={0}>
          <table className="site-table" aria-label={`Appels attribués à ${site} par PE de janvier à décembre`}>
            <caption>Appels attribués = prévision nationale du PE × somme des clés des populations compétentes de {site}.</caption>
            <thead><tr>
              <th scope="col">Point d’entrée (PE)</th>
              {MOIS_COMPLETS.map(m => <th scope="col" key={m}>{m}</th>)}
              <th scope="col" className="site-annual">Total annuel</th>
            </tr></thead>
            <tbody>
              {pes.map(({key, name}) => {
                const valeurs = calculs12.map(d => d.parSite[site].parPE[key].attribues);
                return <tr key={key}>
                  <th scope="row">{name}</th>
                  {valeurs.map((v, i) => <td key={i}>{fmtAppels(v)}</td>)}
                  <td className="site-annual">{fmtAppels(sommeComplete(valeurs))}</td>
                </tr>;
              })}
              {pes.length === 0 && <tr><td colSpan={14} className="site-empty">Aucun PE habilité pour ce site. Renseignez ses compétences et ses clés de répartition.</td></tr>}
            </tbody>
            <tfoot><tr>
              <th scope="row">Total {site} — appels</th>
              {totauxMois.map((v, i) => <td key={i}>{fmtAppels(v)}</td>)}
              <td>{fmtAppels(totalAnnuel)}</td>
            </tr></tfoot>
          </table>
        </div>
        <p className="text-xs text-gray-500">Les PE affichés correspondent aux compétences du site. Les volumes se recalculent avec les prévisions, les compétences et les clés de répartition. Pour ajuster les appels à envoyer, utilisez « Ouvrir les clés de répartition » dans la vue nationale.</p>
        <p className="text-xs text-gray-500">0 = aucun appel attribué par les clés actuelles ; — = prévision manquante pour une part attribuée. Les appels sont affichés à l’entier près ; les totaux sont calculés avant arrondi.</p>
      </div>
    </dialog>
  );
}

function Dashboard() {
  const [effectifs, setEffectifs] = useState(INIT_EFFECTIFS);
  const [heures, setHeures] = useState(INIT_HEURES);
  const [presence, setPresence] = useState(INIT_PRESENCE);
  const [productivite, setProductivite] = useState(INIT_PRODUCTIVITE);
  const [appels, setAppels] = useState(INIT_APPELS);
  const [elig, setElig] = useState(INIT_ELIG);
  const [flux, setFlux] = useState(INIT_FLUX_EDITABLES);
  const [modesPE, setModesPE] = useState(INIT_MODES_PE);
  const [peFlux, setPeFlux] = useState('SNT');
  const [repartitionOuverte, setRepartitionOuverte] = useState(false);
  const [ongletRepartition, setOngletRepartition] = useState('flux');
  const repartitionDialog = useRef(null);
  useEffect(() => {
    const dialog = repartitionDialog.current;
    if (repartitionOuverte && !dialog.open) dialog.showModal();
    else if (!repartitionOuverte && dialog.open) dialog.close();
  }, [repartitionOuverte]);
  const [populationHeures, setPopulationHeures] = useState('PTV_MULTI_CDI');
  const setFluxCell = (pe, ss, i, v) => {
    if (!cleModifiable(ss, pe, elig, modesPE)) return;
    if (positive(v) > 0 && elig[ss][pe] !== 1) setElig((p) => ({...p, [ss]: {...p[ss], [pe]: 1}}));
    setFlux((p) => ({...p,[pe]:{...p[pe],[ss]:setAt(p[pe][ss],i,v)}}));
  };
  const [moisIdx, setMoisIdx] = useState(0);
  const [ongletActif, setOngletActif] = useState('resultats');
  const [siteOuvert, setSiteOuvert] = useState(null);

  const setEffCell = (population, statut, moisI, v) =>
    setEffectifs((p) => ({ ...p, [population]: { ...p[population], [statut]: setAt(p[population][statut], moisI, v) } }));
  const setHeuresCell = (statut, moisI, v) => setHeures((p) => ({ ...p, [statut]: setAt(p[statut], moisI, v) }));
  const setPresenceCell = (statut, moisI, v) => setPresence((p) => ({ ...p, [statut]: setAt(p[statut], moisI, v) }));
  const setProdCell = (pe, moisI, v) => setProductivite((p) => ({ ...p, [pe]: setAt(p[pe], moisI, v) }));
  const setAppelsCell = (pe, moisI, v) => setAppels((p) => ({ ...p, [pe]: setAt(p[pe], moisI, v) }));
  const toggleElig = (ss, pe) => setElig((p) => ({ ...p, [ss]: { ...p[ss], [pe]: p[ss][pe] ? 0 : 1 } }));
  const changerMode = (pe, mode) => {
    setModesPE((p) => ({...p, [pe]: mode}));
  };

  const calculs12 = useMemo(() => MOIS.map((m,i) => {
    const detail = calculerMois(i,effectifs,heures,presence,productivite,appels,elig,flux,modesPE);
    return {...detail, capacitesAppels: calculerCapacitesAppels(detail, productivite, i)};
  }),
    [effectifs,heures,presence,productivite,appels,elig,flux,modesPE]);
  const detailMois = calculs12[moisIdx];
  const national = detailMois.national;
  const populationDetail = detailMois.populations[populationHeures];
  const peOrdonnes = ['MONO','MULTI'].flatMap(mode=>PE_LIST.filter(({key})=>modesPE[key]===mode));
  const synthese12 = calculs12.map((d,i) => ({mois:MOIS[i], ...d.national}));
  const maxAbs = Math.max(...synthese12.map(s=>Math.max(s.capacite,s.charge || 0)),1);
  const lignesFlux = (lignes) => lignes.map(({key:ss, site, name, statut, label}) => (
    <tr key={ss} className={statut === 'CDI' ? 'population-start' : ''}>
      <td>{site}</td>
      <td>{name}</td>
      <td>{statut === 'ALT' ? 'alternants' : statut}</td>
      <td className="text-center"><input type="checkbox" checked={elig[ss][peFlux] === 1} aria-label={`${label}, compétence ${peFlux}`} onChange={() => toggleElig(ss,peFlux)} /></td>
      {MOIS.map((m,i) => <td key={m}><PercentInput value={flux[peFlux][ss][i]} disabled={!cleModifiable(ss,peFlux,elig,modesPE)} label={`${label}, ${peFlux}, ${m}, part du flux en %`} onChange={(v) => setFluxCell(peFlux,ss,i,v)} /></td>)}
    </tr>
  ));

  return (
    <div className="max-w-6xl mx-auto p-4 text-sm space-y-6">
      <div>
        <h2 className="text-lg font-medium mb-1">Dashboard PDM — prévisions d’appels, charge et capacité, 2026 ({PE_LIST.length} PE)</h2>
        <p className="text-gray-500 text-xs">Prévision d’appels × Clé de répartition = Appels attribués. Appels attribués ÷ Productivité du PE = Charge prévue en heures.</p>
        <p className="text-gray-500 text-xs">Capacité en appels = heures affectées au PE × productivité. Les heures disponibles des effectifs restent indépendantes des clés.</p>
      </div>

      <section aria-labelledby="appels-sites-titre">
        <h3 id="appels-sites-titre" className="font-medium mb-2">Appels attribués par site — janvier à décembre {SOURCE_BESOINS.annee}</h3>
        <div className="grid grid-cols-3 gap-3">
          {SITES_PLATEFORMES.map(site => (
            <button key={site} type="button" className="site-launch" aria-label={`Ouvrir la fenêtre ${site}`}
              aria-haspopup="dialog" aria-controls={`appels-${site}`} onClick={() => setSiteOuvert(site)}>
              <span className="site-launch-title"><span>{site}</span><span aria-hidden="true">↗</span></span>
              <span><span className="site-launch-total">{fmtAppels(sommeComplete(calculs12.map(d => d.parSite[site].attribues)))}</span> appels / an</span>
              <span className="site-launch-hint">{peDuSite(site, elig).length} PE · Voir les appels par PE et par mois</span>
            </button>

        onFermer={() => setSiteOuvert(null)} calculs12={calculs12} elig={elig} />)}

      <div>

        <div className="space-y-1">
          {synthese12.map((s) => (
            <div key={s.mois} className="flex items-center gap-2">
              <span className="w-10 text-xs text-gray-500">{s.mois}</span>

                <div className="bg-blue-400 rounded-sm" style={{ width: `${(s.capacite / maxAbs) * 100}%` }} title={`Capacité disponible : ${fmtHeures(s.capacite)} h`} />

              <div className="flex-1 flex gap-0.5 h-4">
                <div className="bg-yellow-400 rounded-sm" style={{ width: `${((s.charge || 0) / maxAbs) * 100}%` }} title={`Charge attribuée : ${fmtHeures(s.charge)} h`} />
              </div>
              <span className={`w-20 text-right text-xs font-medium ${couleurDelta(s.delta)}`}>

        </div>
        <div className="bg-gray-50 rounded-lg p-3">
          <p className="text-xs text-gray-500">Appels attribués par les clés — {MOIS[moisIdx]}</p>

              <tr className="border-t bg-gray-50"><th colSpan={4} className="text-left">Total du PE — toutes populations compétentes</th>{calculs12.map((d,i) => <td key={i} className="text-right">{percentText(d.totalFlux[peFlux])} %</td>)}</tr>
              <tr><th colSpan={4} className="text-left">Écart à 100 % (+ manquant / − dépassement)</th>{calculs12.map((d,i) => <td key={i} className="text-right">{percentText(1-d.totalFlux[peFlux])} %</td>)}</tr>
              <tr className="bg-gray-50"><th colSpan={4} className="text-left">Prévision (appels)</th>{calculs12.map((d,i)=><td key={i} className="text-right">{fmtAppels(d.parPE[peFlux].prevision)}</td>)}</tr>
              <tr><th colSpan={4} className="text-left">Appels attribués par les clés</th>{calculs12.map((d,i)=><td key={i} className="text-right">{fmtAppels(d.parPE[peFlux].attribues)}</td>)}</tr>
              <tr><th colSpan={4} className="text-left">Écart appels attribués − prévision</th>{calculs12.map((d,i)=><td key={i} className="text-right">{fmtEcartAppels(d.parPE[peFlux].ecartPrevision)}</td>)}</tr>
            </tbody>
          </table>
          <p className="text-xs text-gray-500">Les clés saisies sont appliquées telles quelles. Un total de 105 % représente 105 % de la prévision, sans blocage ni remise automatique à 100 %. Le total et l’écart restent visibles pendant vos ajustements. Décocher une population conserve sa clé, mais l’exclut des calculs.</p>
        </div>
      )}

      {ongletRepartition === 'repartition' && (
        <div className="space-y-4 overflow-x-auto">
          <p>Les heures de charge résultent des appels attribués et de la productivité. Ce bilan se recalcule à chaque modification des prévisions, des clés ou des effectifs.</p>
          <label>Population / statut : <select aria-label="Population du bilan" className="border rounded px-2 py-1" value={populationHeures} onChange={(e) => setPopulationHeures(e.target.value)}>{POPULATION_STATUTS.map(({key,label}) => <option key={key} value={key}>{label}</option>)}</select></label>
          <table className="w-full text-xs" aria-label="Bilan mensuel de la population">
            <thead><tr><th className="text-left">Indicateur (h)</th>{MOIS.map(m=><th key={m}>{m}</th>)}</tr></thead>
            <tbody>{[
              ['capacite','Capacité disponible'],['chargeMono','1. Charge monosite'],['restantApresMono','Disponible après monosite'],
              ['chargeMulti','2. Charge multisite'],['charge','Charge totale attribuée'],['delta','Delta : charge − capacité'],
              ['libres','Heures encore libres'],['deficit','Heures manquantes']
            ].map(([champ,label])=><tr key={champ} className="border-t"><th className="text-left py-2">{label}</th>{calculs12.map((d,i)=><td key={i} className={`text-right ${champ==='delta'?couleurDelta(d.populations[populationHeures][champ]):''}`}>{champ==='delta'?fmtDeltaHeures(d.populations[populationHeures][champ]):fmtHeures(d.populations[populationHeures][champ])}</td>)}</tr>)}</tbody>
          </table>
          <h3>Détail des appels attribués — {MOIS[moisIdx]} 2026</h3>
          <table className="w-full text-xs" aria-label="Détail de la charge par PE"><thead><tr><th className="text-left">PE</th><th>Activité</th><th>Clé de la prévision (%)</th><th>Appels attribués</th><th>Productivité (appels/h)</th><th>Charge (h)</th></tr></thead>
            <tbody>{peOrdonnes.map(({key,name}) => {const d=populationDetail.lignes[key];return <tr key={key} className="border-t">
              <td className="py-2">{name}</td><td>{modesPE[key]==='MONO'?'1. Monosite':'2. Multisite'}</td><td className="text-right">{percentText(detailMois.fluxEffectif[key][populationHeures])}</td>
              <td className="text-right">{fmtAppels(d.attribues)}</td><td className="text-right">{detailMois.productivitesManquantes.includes(key)?'—':productivite[key][moisIdx]}</td>
              <td className="text-right">{fmtHeures(d.charge)}</td></tr>;})}</tbody>
          </table>
        </div>
      )}

        </div>
      </dialog>

      {ongletActif === 'effectifs' && (
        <div className="space-y-4 overflow-x-auto">
          <p className="text-xs text-gray-400">{POPULATIONS.length} populations, soit {POPULATION_STATUTS.length} lignes. Chaque DR comprend les pôles AC (CDI, CDD et alternants) et le réseau commercial (CDI). Capacité du site = somme des capacités de ses populations (Effectif × Heures/pers × Présence). Les heures et taux de présence restent communs par statut.</p>
          {POPULATIONS.map(({ key: population, site, name, statuts }) => (
            <div key={population}>
              <p className="font-medium mb-1">{site === name ? name : `${site} / ${name}`}</p>
              <table className="border-collapse text-xs">
                <thead>
                  <tr>
                    <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Site / Population / Statut</th>
                    {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {statuts.map((st) => (
                    <tr key={st}>
                      <td className="pr-2 py-0.5 font-medium whitespace-nowrap">{POPULATION_STATUTS.find((row) => row.population === population && row.statut === st).label}</td>
                      {MOIS.map((m, i) => (
                        <td key={m} className="px-0.5 py-0.5">
                          <CellInput value={effectifs[population][st][i]} label={`${population}, ${st}, ${m}, effectif`} onChange={(v) => setEffCell(population, st, i, v)} />
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
          <div>
            <p className="font-medium mb-1">Heures productives / personne</p>
            <table className="border-collapse text-xs">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Statut</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {STATUTS.map((st) => (
                  <tr key={st}>
                    <td className="pr-2 py-0.5 font-medium">{st}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <CellInput value={heures[st][i]} label={`${st}, ${m}, heures par personne`} onChange={(v) => setHeuresCell(st, i, v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div>
            <p className="font-medium mb-1">Taux de présence (%)</p>
            <table className="border-collapse text-xs">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">Statut</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {STATUTS.map((st) => (
                  <tr key={st}>
                    <td className="pr-2 py-0.5 font-medium">{st}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <PercentInput value={presence[st][i]} label={`${st}, ${m}, taux de présence en %`} onChange={(v) => setPresenceCell(st, i, v === null ? 0 : v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {ongletActif === 'productivite' && (
        <div className="space-y-4 overflow-x-auto">
          <div className="bg-blue-50 rounded p-3 space-y-1">
            <p className="font-medium">Appels attribués = prévision × clé · Charge prévue (h) = appels attribués ÷ productivité</p>
            <p>La productivité mesure le nombre d’appels traités par heure. Elle sert à convertir les appels attribués en charge horaire.</p>
            <p className="text-xs text-gray-500">Modifiez les besoins directement dans le tableau ci-dessous. Consultez l’onglet « Capacité en appels (12 mois) » pour les volumes que les effectifs permettent de traiter.</p>
          </div>
          <div>
            <p className="font-medium mb-1">Besoins mensuels en appels — valeurs modifiables</p>
            <table className="border-collapse text-xs" aria-label="Besoins mensuels en appels">
              <thead><tr><th className="text-left pr-2 pb-1">PE</th>{MOIS.map((m) => <th key={m} className="px-1 pb-1">{m}</th>)}</tr></thead>
              <tbody>
                {PE_LIST.map(({key,name}) => <tr key={key} className="border-t">
                  <td className="pr-2 py-1 font-medium whitespace-nowrap">{name}</td>
                  {MOIS.map((m,i) => <td key={m} className="px-1 py-1">
                    <CellInput value={appels[key][i]} decimals={0} allowEmpty label={`${name}, ${m}, nombre d’appels`} onChange={(v) => setAppelsCell(key, i, v)} width={88} />
                  </td>)}
                </tr>)}
                <tr className="border-t bg-gray-50"><th className="text-left pr-2 py-1">Prévision totale (appels)</th>{calculs12.map((d,i) => <td key={i} className="px-1 py-1 text-right font-medium">{fmtAppels(d.national.prevision)}</td>)}</tr>
              </tbody>
            </table>
          </div>
          {calculs12.some((d) => d.appelsManquants.length > 0) && <p role="status" className="text-yellow-700 text-xs">« — » : prévision manquante ou résultat incomplet. Une productivité absente ne masque pas les prévisions d’appels renseignées.</p>}
          <details>
            <summary className="text-xs text-gray-500">Source des besoins</summary>
            <p className="text-xs text-gray-500">Source : {SOURCE_BESOINS.fichier} / {SOURCE_BESOINS.feuille}, série « {SOURCE_BESOINS.serie} », colonnes B à M, janvier à décembre {SOURCE_BESOINS.annee}. Les appels sont affichés sans décimale. Les calculs conservent la précision du fichier. AMHAUD est repris une seule fois, dans le bloc B222:M222.</p>
            <p className="text-xs text-gray-500">Pour TLV EPI, TLV SPE2 et SPE2, le total annuel du classeur diffère d’un appel de la somme des mois. Les calculs de la maquette utilisent les valeurs mensuelles.</p>
          </details>
          <div>
            <p className="font-medium mb-1">Productivité — nombre d’appels traités par heure</p>
            <table className="border-collapse text-xs" aria-label="Productivités en appels par heure">
              <thead>
                <tr>
                  <th className="text-left pr-2 pb-1 text-gray-500 font-normal">PE</th>
                  {MOIS.map((m) => <th key={m} className="px-1 pb-1 text-gray-500 font-normal">{m}</th>)}
                </tr>
              </thead>
              <tbody>
                {PE_LIST.map(({ key, name }) => (
                  <tr key={key}>
                    <td className="pr-2 py-0.5 font-medium">{name}</td>
                    {MOIS.map((m, i) => (
                      <td key={m} className="px-0.5 py-0.5">
                        <CellInput value={productivite[key][i]} allowEmpty label={`${name}, ${m}, productivité en appels par heure`} onChange={(v) => setProdCell(key, i, v)} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {ongletActif === 'competences' && (
        <div className="overflow-x-auto">
          <p className="text-xs text-gray-400 mb-2">
            Les compétences indiquent les PE autorisés pour chaque population et statut. Les appels reçus dépendent des clés de la prévision ; les heures de charge sont calculées avec la productivité.
            Décocher un PE exclut ses appels de la population sans déplacer ses effectifs ; les clés saisies sont conservées. Les PE monosite sont affichés avant les multisites.
          </p>
          <table className="border-collapse text-xs">
            <thead>
              <tr>
                <th className="text-left pr-2 pb-1 text-gray-500 font-normal sticky left-0 bg-white">Site / Population / Statut</th>
                {PE_LIST.map(({ key, name }) => <th key={key} className="px-1 pb-1 text-gray-500 font-normal" title={name}>{key}</th>)}
              </tr>
            </thead>
            <tbody>
              {POPULATION_STATUTS.map(({ key: ss, label }) => (
                <tr key={ss}>
                  <td className="pr-2 py-0.5 font-medium sticky left-0 bg-white whitespace-nowrap">{label}</td>
                  {PE_LIST.map(({ key }) => (
                    <td key={key} className="text-center px-1 py-0.5">
                      <input type="checkbox" aria-label={`${label}, compétence ${key}`} checked={elig[ss][key] === 1} onChange={() => toggleElig(ss, key)} />
                    </td>
                  ))}
                </tr>
              ))}
              <tr className="border-t-2 border-gray-400 bg-blue-50">
                <td className="pr-2 py-1 font-medium sticky left-0 bg-blue-50">Appels attribués — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({ key }) => (
                  <td key={key} className="text-center px-1 py-1 font-medium text-blue-700">{fmtAppels(detailMois.parPE[key].attribues)}</td>
                ))}
              </tr>
              <tr className="bg-yellow-50">
                <td className="pr-2 py-1 font-medium sticky left-0 bg-yellow-50">Besoin (appels) — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({ key }) => (
                  <td key={key} className="text-center px-1 py-1 text-yellow-700">{fmtAppels(detailMois.besoinAppels[key])}</td>
                ))}
              </tr>
              <tr>
                <td className="pr-2 py-1 font-medium sticky left-0 bg-white">Charge prévue (h) — {MOIS[moisIdx]}</td>
                {PE_LIST.map(({key})=><td key={key} className="text-center px-1 py-1">{fmtHeures(detailMois.parPE[key].charge)}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
      )}
      
      

      <footer className="text-xs text-gray-500 text-center border-t pt-4">
        Yann Kahia — Chef de pilotage téléphonie commerciale — Tous droits réservés
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
</body>
</html>
